<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS Loops | Spider</title>
		<link rel="stylesheet" href="../assets/css/style.css" />
	</head>
	<body>
		<section class="projects">
			<h2>CSS Infinite Loop</h2>
			<div class="carousel">
				<div class="loop-group">
					<div class="loop-card">slide 2</div>
					<div class="loop-card">slide 1</div>
					<div class="loop-card">slide 3</div>
					<div class="loop-card">slide 4</div>
					<div class="loop-card">slide 5</div>
					<div class="loop-card">slide 6</div>
				</div>

				<div area-hidden class="loop-group">
					<div class="loop-card">slide 1</div>
					<div class="loop-card">slide 2</div>
					<div class="loop-card">slide 3</div>
					<div class="loop-card">slide 4</div>
					<div class="loop-card">slide 5</div>
					<div class="loop-card">slide 6</div>
				</div>
			</div>
		</section>
	</body>
</html>
