<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kiyaw Elementary Math Game</title>
		<!-- Google Fonts for a rounded, friendly typography style -->
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<!-- Main Game Container -->
		<div class="game-card">
			<!-- Header: Score and Timer Bar -->
			<header class="game-header">
				<div class="stat-badge score-badge">
					<span class="label">SCORE</span>
					<span class="value" id="score">0</span>
				</div>

				<div class="game-title">
					<h1>KIYAW!</h1>
					<p>Math Adventure</p>
				</div>

				<div class="stat-badge timer-badge">
					<span class="label">TIME</span>
					<span class="value" id="timer">30s</span>
				</div>
			</header>

			<!-- Main Play Area -->
			<main class="game-body">
				<!-- Math Question Box -->
				<div class="problem-container">
					<span class="num" id="num1">7</span>
					<span class="operator" id="operator">+</span>
					<span class="num" id="num2">5</span>
					<span class="equals">=</span>
					<span class="question-mark">?</span>
				</div>

				<!-- Visual Helper (Count Stars/Dots for Young Learners) -->
				<div class="visual-helpers">
					<span class="star-icon">⭐</span>
					<span class="star-icon">⭐</span>
					<span class="star-icon">⭐</span>
				</div>

				<!-- Answer Options Grid -->
				<div class="options-grid">
					<button class="btn-option option-1">10</button>
					<button class="btn-option option-2">12</button>
					<button class="btn-option option-3">15</button>
					<button class="btn-option option-4">9</button>
				</div>
			</main>

			<!-- Footer Actions -->
			<footer class="game-footer">
				<button class="btn-action btn-skip">Skip ⏭️</button>
				<button class="btn-action btn-restart">Restart 🔄</button>
			</footer>
		</div>
	</body>
</html>
